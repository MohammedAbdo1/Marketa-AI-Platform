<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Title -->
    <title> - منصة التسويق بالذكاء الاصطناعي</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/favicon.ico">
    
    <!-- Google Font: Cairo for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Select2 CSS (for dropdowns) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <!-- Vendor CSS (Admin Theme) -->
    <link href="src/assets/css/vendor.min.css" rel="stylesheet" type="text/css" />
    <link href="src/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    
    <!-- RTL Styles -->
    <link href="src/assets/css/app-rtl.min.css" rel="stylesheet" type="text/css" id="app-style" />
    
    <!-- Custom CSS -->
    <link href="src/assets/css/custom.css" rel="stylesheet" type="text/css" />
    
    <link href="src/assets/main.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* Arabic Font */
        body {
            font-family: 'Cairo', sans-serif;
        }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="loading" data-layout-color="light" data-layout-mode="fluid" data-sidebar-theme="light">
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>
    
    <!-- Vue App Container -->
    <div id="app"></div>
    
    <!-- Vendor JS -->
    <script src="src/assets/js/vendor.min.js"></script>
    
    <!-- App JS -->
    <script src="src/assets/js/app.js"></script>
    
    <!-- Vue App Entry Point -->
    <script type="module" src="src/main.js"></script>
    
    <!-- Hide Loading Screen after Vue loads -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.display = 'none';
                }
            }, 500);
        });
    </script>
</body>
</html>
